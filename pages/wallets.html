<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Kelola dompet, saldo, pemasukan, pengeluaran, dan transfer di Finora.">
  <meta name="theme-color" content="#7C3AED">
  <title>Dompet — Finora</title>
  <link rel="icon" type="image/svg+xml" href="../assets/images/favicon.svg">
  <script src="../assets/js/theme-init.js"></script>
  <link rel="stylesheet" href="../assets/css/variables.css">
  <link rel="stylesheet" href="../assets/css/reset.css">
  <link rel="stylesheet" href="../assets/css/layout.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <link rel="stylesheet" href="../assets/css/dashboard.css">
  <link rel="stylesheet" href="../assets/css/pages.css">
  <link rel="stylesheet" href="../assets/css/responsive.css">
</head>
<body data-page="wallets">
  <div class="app-shell">
    <aside id="sidebar" class="sidebar" aria-label="Navigasi samping"></aside>

    <div class="app-main">
      <header class="app-header">
        <div>
          <p class="page-eyebrow">Kantong Keuangan</p>
          <h1 class="page-title">Dompet</h1>
          <p class="page-subtitle">Pisahkan saldo tunai, bank, dan e-wallet dalam satu tempat.</p>
        </div>
        <button type="button" class="btn btn-primary" data-wallets-add aria-label="Buat Dompet">
          <i data-lucide="plus" aria-hidden="true"></i>
          <span>Buat Dompet</span>
        </button>
      </header>

      <main id="page-content" class="page-content">
        <section id="wallets-summary" class="summary-grid" aria-label="Ringkasan dompet" aria-live="polite"></section>

        <div class="toolbar">
          <div class="search-field input-wrap has-icon">
            <span class="input-icon"><i data-lucide="search" aria-hidden="true"></i></span>
            <input class="input" id="wallets-search" type="search" placeholder="Cari nama dompet..." aria-label="Cari dompet">
          </div>
          <button type="button" class="icon-button" id="wallets-refresh" aria-label="Muat ulang data dompet" title="Muat ulang">
            <i data-lucide="refresh-cw" aria-hidden="true"></i>
          </button>
          <span class="toolbar-spacer"></span>
          <span id="wallets-result-count" class="result-count"></span>
        </div>

        <section id="wallets-grid" class="wallets-grid" aria-label="Daftar dompet" aria-live="polite"></section>
      </main>
    </div>
  </div>

  <nav id="bottom-nav" class="bottom-nav" aria-label="Navigasi bawah"></nav>
  <div id="modal-root"></div>
  <div id="toast-root" class="toast-root" aria-live="polite"></div>

  <script src="../assets/vendor/lucide.js"></script>
  <script type="module" src="../assets/js/app.js"></script>
</body>
</html>
